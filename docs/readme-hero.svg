<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Laboratory Safety Protocols</title>
  <desc id="desc">Chemical, environmental, and catalysis laboratory operating rules.</desc>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a2b"/>
      <stop offset="55%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Flask Interior Clip Mask -->
    <clipPath id="flaskClip">
      <path d="M 965 60 V 125 L 900 240 A 20 20 0 0 0 920 260 H 1060 A 20 20 0 0 0 1080 240 L 1015 125 V 60 Z"/>
    </clipPath>

    <style>
      /* --- Liquid Wave Animations --- */
      @keyframes waveFrontMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-120px); }
      }
      @keyframes waveBackMove {
        0% { transform: translateX(-120px); }
        100% { transform: translateX(0); }
      }
      .wave-front {
        animation: waveFrontMove 3.6s linear infinite;
      }
      .wave-back {
        animation: waveBackMove 5.2s linear infinite;
      }

      /* --- Rising Bubble Animations (Now escaping the flask) --- */
      @keyframes bubbleRise1 {
        0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
        15% { opacity: 0.9; }
        70% { opacity: 0.8; }
        100% { transform: translate(-10px, -220px) scale(1.15); opacity: 0; }
      }
      @keyframes bubbleRise2 {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 0.9; }
        75% { opacity: 0.7; }
        100% { transform: translate(12px, -240px) scale(1.2); opacity: 0; }
      }
      @keyframes bubbleRise3 {
        0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
        25% { opacity: 0.9; }
        65% { opacity: 0.8; }
        100% { transform: translate(-4px, -200px) scale(1.1); opacity: 0; }
      }

      .b1 { animation: bubbleRise1 3.2s infinite ease-in; }
      .b2 { animation: bubbleRise2 3.8s infinite ease-in 0.7s; }
      .b3 { animation: bubbleRise3 2.9s infinite ease-in 1.4s; }
      .b4 { animation: bubbleRise1 3.5s infinite ease-in 2.1s; }
      .b5 { animation: bubbleRise2 3.3s infinite ease-in 1.1s; }
      .b6 { animation: bubbleRise3 4.0s infinite ease-in 2.6s; }

      /* --- Interactive Button Arrow --- */
      @keyframes arrowPulse {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(6px); }
      }
      .arrow {
        animation: arrowPulse 1.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Canvas -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- ================= FLASK GRAPHIC ================= -->
  <g id="flask-system">
    
    <!-- Clipped Liquid -->
    <g clip-path="url(#flaskClip)">
      <!-- Back liquid wave (lightened to remove shadow effect) -->
      <path class="wave-back" fill="#fef08a" opacity="0.6"
            d="M 800 214 q 30 6, 60 0 t 60 0 q 30 6, 60 0 t 60 0 q 30 6, 60 0 t 60 0 q 30 6, 60 0 t 60 0 q 30 6, 60 0 t 60 0 V 275 H 800 Z"/>
      
      <!-- Front liquid wave -->
      <path class="wave-front" fill="url(#liquidGrad)"
            d="M 820 210 q 30 -7, 60 0 t 60 0 q 30 -7, 60 0 t 60 0 q 30 -7, 60 0 t 60 0 q 30 -7, 60 0 t 60 0 V 275 H 820 Z"/>
    </g>

    <!-- Rising reaction bubbles (Moved outside clip path so they can rise through the neck) -->
    <g class="b1"><circle cx="972" cy="245" r="4.5" fill="#fef08a"/></g>
    <g class="b2"><circle cx="1006" cy="250" r="6" fill="#fbbf24"/></g>
    <g class="b3"><circle cx="986" cy="238" r="3.5" fill="#fef9c3"/></g>
    <g class="b4"><circle cx="1012" cy="246" r="5" fill="#fef08a"/></g>
    <g class="b5"><circle cx="962" cy="242" r="3" fill="#fbbf24"/></g>
    <g class="b6"><circle cx="995" cy="234" r="4" fill="#fef9c3"/></g>

    <!-- Glass Contour & Rim -->
    <path d="M 965 60 V 125 L 900 240 A 20 20 0 0 0 920 260 H 1060 A 20 20 0 0 0 1080 240 L 1015 125 V 60 Z" 
          fill="none" stroke="#86efac" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 955 60 H 1025" stroke="#86efac" stroke-width="7" stroke-linecap="round"/>

    <!-- Flask Graduation Marks -->
    <line x1="1008" y1="165" x2="1023" y2="165" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="1017" y1="188" x2="1035" y2="188" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="1026" y1="212" x2="1047" y2="212" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ================= TEXT & CTA ================= -->
  <g fill="#ecfeff" font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="84" font-size="16" letter-spacing="5" fill="#86efac">SAFETY IS PART OF THE EXPERIMENT</text>
    <text x="72" y="144" font-size="48" font-weight="700">LABORATORY</text>
    <text x="72" y="194" font-size="48" font-weight="700">PROTOCOLS</text>
    <text x="72" y="232" font-size="20" fill="#bae6fd">Safety · waste · emergency response</text>
    
    <!-- Action Button -->
    <g transform="translate(72, 268)" cursor="pointer">
      <rect width="270" height="42" rx="21" fill="#86efac"/>
      <text x="24" y="27" font-size="13" font-weight="700" fill="#071a2b" letter-spacing="2">OPEN THE SOP</text>
      <text x="220" y="27" font-size="16" font-weight="700" fill="#071a2b" class="arrow">→</text>
    </g>
  </g>
</svg>
