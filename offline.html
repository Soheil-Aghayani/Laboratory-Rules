<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>حالت آفلاین | آزمایشگاه پسماند</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
    @media(prefers-color-scheme:dark){:root{background:#0f172a;color:#f8fafc}}
    body{display:grid;min-height:100vh;place-items:center;margin:0;padding:1.5rem;box-sizing:border-box}
    main{max-width:34rem;padding:2rem;border:1px solid #cbd5e1;border-radius:1.25rem;background:rgba(255,255,255,.8);text-align:center;box-shadow:0 18px 45px -18px rgba(15,23,42,.2)}
    @media(prefers-color-scheme:dark){main{border-color:#334155;background:#1e293b}}
    h1{margin-top:0;font-size:1.35rem}p{line-height:1.9;color:#475569}@media(prefers-color-scheme:dark){p{color:#cbd5e1}}
    a{display:inline-block;margin-top:1rem;padding:.7rem 1rem;border-radius:.7rem;background:#047857;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>اتصال اینترنت در دسترس نیست</h1>
    <p>صفحهٔ اصلی هنوز در این دستگاه ذخیره نشده است. پس از اتصال دوباره، یک‌بار پورتال را باز کنید تا راهنماها و اطلاعات اصلی برای استفادهٔ آفلاین آماده شوند.</p>
    <a href="./">تلاش دوباره</a>
  </main>
</body>
</html>
